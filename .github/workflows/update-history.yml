name: Update LOTO history

on:
  workflow_dispatch:
  schedule:
    - cron: '30 12 * * 1,4,5'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch and validate history
        run: python update_history.py
      - name: Commit updated CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/LOTO6_ALL.csv data/LOTO7_ALL.csv
          if git diff --cached --quiet; then
            echo "No history changes"
          else
            git commit -m "Update LOTO history"
            git push
          fi
